services:
  - type: web
    name: sologym-web
    runtime: docker
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: SoloGym
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        fromService:
          type: web
          name: sologym-web
          property: host
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /var/www/html/database/database.sqlite
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
